name: Tests

on: [push, pull_request]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test pipeline and SWAD regression cases
        run: python -m pytest -q
      - name: Verify packaged benchmark
        run: python scripts/verify_benchmark.py
      - name: Smoke test on synthetic inputs
        run: python run.py train --smoke-test
